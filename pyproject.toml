[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-patch"
dynamic = ["version"]
description = "A Python package for processing and handling whole slide images"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Yousef Kotp"},
    {name = "Omar Metwally"},
    {name = "Ahmed Alagha"},
]
keywords = ["atlas-patch", "whole-slide-image", "wsi", "tissue-segmentation", "patch-extraction", "computational-pathology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
]

dependencies = [
    "openslide-python>=1.2.0",
    "Pillow>=9.0.0",
    "numpy>=1.21.0",
    "h5py>=3.8.0",
    "opencv-python>=4.7.0",
    "click>=8.0.0",
    "torch>=2.0.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.5.0",
    "tqdm>=4.66.0",
    "torchvision>=0.15.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
patch-encoders = [
    "einops>=0.8.0",
    "einops-exts>=0.0.4",
    "fairscale>=0.4.0",
    "gdown>=5.2.0",
    "open-clip-torch>=2.24.0",
    "sentencepiece>=0.2.0",
    "timm>=0.9.0",
    "transformers>=4.41.0",
]
slide-encoders = [
    "einops>=0.8.0",
    "einops-exts>=0.0.4",
    "fairscale>=0.4.0",
    "gdown>=5.2.0",
    "open-clip-torch>=2.24.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "timm>=0.9.0",
    "transformers>=4.41.0",
    "environs>=11.0.0",
    "sacremoses>=0.1.1",
    "moozy>=0.1.0",
]
patient-encoders = [
    "timm>=0.9.0",
    "moozy>=0.1.0",
]
titan = [
    "einops>=0.8.0",
    "einops-exts>=0.0.4",
    "fairscale>=0.4.0",
    "gdown>=5.2.0",
    "open-clip-torch>=2.24.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "transformers>=4.41.0",
]
prism = [
    "safetensors>=0.4.0",
    "timm>=0.9.0",
    "transformers>=4.41.0",
    "environs>=11.0.0",
    "sacremoses>=0.1.1",
]
moozy = [
    "timm>=0.9.0",
    "moozy>=0.1.0",
]
orchestrator = [
    # Phase 1 (atlas_conductor operational core) needs only PyYAML at runtime; h5py
    # and numpy are already core deps. The heavy choreography/telemetry backends —
    # A2A, Google ADK, and google-cloud-bigquery — are added to this same extra when
    # they are wired in phase 4 (distribution), behind guarded imports so the core
    # `atlaspatch` CLI never imports them.
    "pyyaml>=6.0",
    # Phase 3 (add-conductor-gui): the read-only observability GUI. Imported only inside
    # `atlas_conductor/gui/app.py` (never from the core CLI/telemetry path — enforced by
    # a CI import-guard test), so `pip install atlas-patch` and the `atlaspatch` CLI are
    # unaffected.
    "streamlit>=1.30",
    # Phase 4 (add-conductor-distribution): the A2A agent transport and the BigQuery
    # telemetry backend. Each is imported only inside its own module — `a2a-sdk` (plus its
    # HTTP server stack) in `atlas_conductor/transport/a2a.py`, `google-adk` alongside it,
    # and `google-cloud-bigquery` in `atlas_conductor/telemetry_bigquery.py` — never from
    # the core CLI/telemetry path, enforced by the CI import-guard test. `pip install
    # atlas-patch` and the base `atlaspatch` CLI stay free of all three (design D-DIST-5).
    "a2a-sdk>=0.2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "google-adk>=0.1.0",
    "google-cloud-bigquery>=3.20",
]
release = [
    "build>=1.2.2",
    "twine>=5.1.1",
]
dev = [
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

# See README for installation instructions:
#   pip install git+https://github.com/facebookresearch/sam2.git  (required)
#   pip install git+https://github.com/Mahmoodlab/CONCH.git       (optional)
#   pip install git+https://github.com/lilab-stanford/MUSK.git    (optional)

[project.scripts]
atlaspatch = "atlas_patch.cli:main"
atlaspatch-conduct = "atlas_conductor.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_patch*", "atlas_conductor*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"atlas_patch" = ["configs/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "atlas_patch.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["atlas_patch"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
